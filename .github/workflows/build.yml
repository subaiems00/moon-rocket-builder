name: Build

# Phase 5: cross-platform release builds. Triggers:
#   - tag push matching v*         → full build + attach to GitHub release
#   - workflow_dispatch            → manual build (smoke test from the
#                                    Actions tab without burning a release)
#
# Each platform builds in parallel via a matrix, so a 3-platform build
# takes about as long as the slowest single-platform build.
#
# Outputs are uploaded as `godot-{platform}` artifacts (90-day retention
# for non-release runs, attached to the matching release on tag pushes).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated platforms to build (windows,linux,macos)'
        required: false
        default: 'windows,linux,macos'

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------
  # CI gate — fail fast if the project doesn't import cleanly. Reuses the
  # same Godot binary as the export jobs to catch any "imports on dev but
  # not on CI" inconsistency.
  # ----------------------------------------------------------------------
  validate:
    name: Validate import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: godot/Godot_v4.3-stable_linux.x86_64
          key: godot-4.3-stable-linux
      - name: Install Godot 4.3 (headless)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p godot
          curl -L --retry 3 -o godot/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -o godot/godot.zip -d godot/
          rm godot/godot.zip
          chmod +x godot/Godot_v4.3-stable_linux.x86_64
      - name: Headless import
        run: |
          ./godot/Godot_v4.3-stable_linux.x86_64 \
            --headless --import 2>&1 | tee godot-import.log
          if grep -iE "^(ERROR|SCRIPT ERROR|SCRIPT ERROR:|Parse Error)" godot-import.log; then
            echo "Errors detected in Godot import log"
            exit 1
          fi
      - name: Upload import log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-import-log
          path: godot-import.log
          if-no-files-found: ignore

  # ----------------------------------------------------------------------
  # Build matrix — each platform builds in parallel.
  # We pass the Godot binary + templates via reusable paths so all jobs
  # share the same version.
  # ----------------------------------------------------------------------
  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            preset: "Windows Desktop"
            binary: moon-rocket-builder.exe
            archive: moon-rocket-builder-windows.zip
          - platform: linux
            os: ubuntu-latest
            preset: "Linux/X11"
            binary: moon-rocket-builder.x86_64
            archive: moon-rocket-builder-linux.tar.gz
          - platform: macos
            os: macos-latest
            preset: "macOS"
            binary: moon-rocket-builder.app
            archive: moon-rocket-builder-macos.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.3 (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p godot
          curl -L --retry 3 -o godot/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -o godot/godot.zip -d godot/
          rm godot/godot.zip
          chmod +x godot/Godot_v4.3-stable_linux.x86_64
          ls -la godot/

      - name: Install Godot 4.3 (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path godot | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri `
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_win64.exe.zip" `
            -OutFile "godot\godot.zip"
          Expand-Archive -Force -Path "godot\godot.zip" -DestinationPath "godot\"
          Remove-Item "godot\godot.zip"

      - name: Install Godot 4.3 (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p godot
          curl -L --retry 3 -o godot/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_macos.universal.zip
          unzip -o godot/godot.zip -d godot/
          rm godot/godot.zip
          chmod +x godot/Godot_v4.3-stable_macos.universal.app/Contents/MacOS/Godot

      - name: Install Godot export templates
        shell: bash
        run: |
          # The export templates zip is keyed by Godot's minor version
          # (e.g. 4.3.0.stable.mono for the Standard build). On Linux/macOS
          # the runtime auto-fetches templates on first --export, but for
          # CI determinism we download them explicitly.
          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable/
          curl -L --retry 3 -o /tmp/godot-templates.tpz "$TEMPLATE_URL"
          # .tpz is just a tar; extract and arrange into the versioned dir.
          mkdir -p /tmp/godot-templates-extract
          tar -xzf /tmp/godot-templates.tpz -C /tmp/godot-templates-extract
          # Templates land in templates/ subdir of the archive.
          if [ -d /tmp/godot-templates-extract/templates ]; then
            cp -r /tmp/godot-templates-extract/templates/* \
              ~/.local/share/godot/export_templates/4.3.stable/
          else
            cp -r /tmp/godot-templates-extract/* \
              ~/.local/share/godot/export_templates/4.3.stable/
          fi
          ls -la ~/.local/share/godot/export_templates/4.3.stable/ | head -20

      - name: Headless import (warm cache)
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest)
              ./godot/Godot_v4.3-stable_linux.x86_64 --headless --import 2>&1 | tee import.log
              ;;
            windows-latest)
              ./godot/Godot_v4.3-stable_win64.exe --headless --import 2>&1 | Tee-Object -FilePath import.log
              ;;
            macos-latest)
              ./godot/Godot_v4.3-stable_macos.universal.app/Contents/MacOS/Godot --headless --import 2>&1 | tee import.log
              ;;
          esac
          if grep -iE "^(ERROR|SCRIPT ERROR|SCRIPT ERROR:|Parse Error)" import.log; then
            echo "Import errors detected"
            exit 1
          fi

      - name: Export release build
        shell: bash
        run: |
          mkdir -p build/${{ matrix.platform }}
          case "${{ matrix.os }}" in
            ubuntu-latest)
              GODOT_BIN="./godot/Godot_v4.3-stable_linux.x86_64"
              ;;
            windows-latest)
              GODOT_BIN="./godot/Godot_v4.3-stable_win64.exe"
              ;;
            macos-latest)
              GODOT_BIN="./godot/Godot_v4.3-stable_macos.universal.app/Contents/MacOS/Godot"
              ;;
          esac
          echo "Exporting ${{ matrix.preset }}..."
          "$GODOT_BIN" --headless --export-release "${{ matrix.preset }}" \
            "build/${{ matrix.platform }}/${{ matrix.binary }}" 2>&1 | tee export.log
          if [ ! -e "build/${{ matrix.platform }}/${{ matrix.binary }}" ]; then
            echo "Export failed — output missing."
            tail -40 export.log
            exit 1
          fi
          echo ""
          echo "=== Build artifacts ==="
          find "build/${{ matrix.platform }}" -maxdepth 3 -type f | head -20

      - name: Package artifacts
        shell: bash
        run: |
          cd "build/${{ matrix.platform }}"
          case "${{ matrix.binary }}" in
            *.exe)
              # Windows: zip the .exe + any DLLs sidecars Godot emits.
              mkdir staging && cp -r * staging/ 2>/dev/null || true
              apt-get install -y zip >/dev/null 2>&1 || true
              (cd staging && zip -r "../${{ matrix.archive }}" .)
              ;;
            *.x86_64)
              # Linux: tar.gz the binary + any sidecars.
              tar -czf "../${{ matrix.archive }}" -- *
              ;;
            *.app)
              # macOS: zip the .app bundle (preserves Info.plist + Contents/).
              zip -r "../${{ matrix.archive }}" "${{ matrix.binary }}" -x "*.DS_Store"
              ;;
          esac
          cd ../..
          ls -la build/${{ matrix.archive }}
          du -h build/${{ matrix.archive }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-${{ matrix.platform }}
          path: build/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 90

  # ----------------------------------------------------------------------
  # Attach to release — runs after every platform succeeds, only on tag
  # pushes. Downloads each artifact and uploads to the matching GitHub
  # release via the API. Skips if the asset is already attached (idempotent).
  # ----------------------------------------------------------------------
  attach:
    name: Attach binaries to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List downloads
        run: ls -la dist/

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Attaching artifacts to release for tag: ${TAG}"

          # Get the release id for this tag.
          RELEASE_JSON=$(curl -sS \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")
          RELEASE_ID=$(echo "${RELEASE_JSON}" | python -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Release id: ${RELEASE_ID}"

          # Loop over each artifact, fetch existing asset list, upload only
          # if not already attached (idempotent re-runs).
          EXISTING=$(echo "${RELEASE_JSON}" | python -c "import sys,json; print(' '.join(a['name'] for a in json.load(sys.stdin).get('assets', [])))")
          echo "Already attached: ${EXISTING}"

          for f in dist/*; do
            name=$(basename "$f")
            if echo " ${EXISTING} " | grep -q " ${name} "; then
              echo "  Skipping ${name} (already attached)"
              continue
            fi
            echo "  Uploading ${name}..."
            curl -sS \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              -X POST \
              --data-binary "@${f}" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${name}" \
              | python -c "import sys,json; a=json.load(sys.stdin); print(f'    OK {a[\"name\"]} ({a[\"size\"]} bytes, state={a[\"state\"]})')"
          done
          echo "Done."
