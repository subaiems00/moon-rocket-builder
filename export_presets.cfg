; Moon Rocket Builder — Godot 4.3 export presets.
;
; These are referenced from the GitHub Actions `export-builds.yml` workflow.
; Each preset uses the platform names registered by Godot 4.3's
; editor export plugins: "Windows Desktop", "Linux", "macOS", "Web".
;
; Note: Godot 4.3 renamed "Linux/X11" to "Linux" (issue #89012). Older
; presets using "Linux/X11" need to be updated.
;
; To regenerate locally with the editor:
;   1. Open project.godot in Godot 4.3
;   2. Project → Export → Add → pick the preset
;   3. Configure options → "Export Project..."
;   4. Close Godot — the file is updated.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/windows/MoonRocketBuilder.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon="res://assets/icon.svg"
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name=""
application/product_name="Moon Rocket Builder"
application/file_description="Stylized 3D cartoon rocket-builder and lunar landing game."
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true

