; Moon Rocket Builder — export presets for headless CI builds.
; Run locally with:
;   godot --headless --export-release "Windows Desktop" build/windows/moon-rocket-builder.exe
;
; These presets mirror the project's runtime settings (Forward+ renderer,
; 1280x720 window, vsync on). They produce single-binary releases with
; no code signing — fine for a prototype distribution.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../build/windows/moon-rocket-builder.exe"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_strip=true
debug/strip_format=0
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/embed_pck=false
texture_format/loader_only=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name="subaiems00"
application/product_name="Moon Rocket Builder"
application/file_description="Stylized 3D cartoon rocket-builder and lunar landing game."
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false
linux_deploy/flatpak=false
linux_deploy/flatpak_categories="Game;ArcadeGame;"
binary_format/architecture="x86_64"
windows_native_runner/enable=false
embed_subresources=false
application/modify_resources=true

